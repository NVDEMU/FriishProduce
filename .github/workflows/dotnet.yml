name: Build and release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows build (legacy WinForms)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore FriishProduce.sln -NonInteractive

      - name: Build application
        run: msbuild FriishProduce\FriishProduce.csproj -t:Rebuild -property:Configuration=Release /p:PublicRelease=false /m

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "FriishProduce/bin/Release/FriishProduce.exe"
          if (-not (Test-Path $exe)) {
            throw "Build completed without producing $exe"
          }
          $size = (Get-Item $exe).Length
          if ($size -lt 100KB) {
            throw "The application executable is unexpectedly small ($size bytes)."
          }
          Write-Host "Verified $exe ($size bytes)."

      - name: Package Windows application
        shell: pwsh
        run: |
          if (Test-Path "FriishProduce_Windows.zip") {
            Remove-Item "FriishProduce_Windows.zip" -Force
          }
          Compress-Archive -Path "FriishProduce/bin/Release/*" -DestinationPath "FriishProduce_Windows.zip" -CompressionLevel Optimal
          if ((Get-Item "FriishProduce_Windows.zip").Length -lt 1MB) {
            throw "The packaged Windows application is unexpectedly small."
          }
          $hash = (Get-FileHash "FriishProduce_Windows.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FriishProduce_Windows.zip" | Set-Content "SHA256SUMS.txt" -Encoding ascii

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: FriishProduce-Windows
          path: |
            FriishProduce_Windows.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Windows Build (${{ github.sha }})"
          files: |
            FriishProduce_Windows.zip
            SHA256SUMS.txt
          prerelease: true
          draft: false
          append_body: false
          body: |
            Automated Windows build from commit ${{ github.sha }}.

            Extract the complete ZIP before running FriishProduce.exe. Do not move the executable out of the extracted folder because the application uses adjacent resources and libraries.

            SHA-256 checksums are included in SHA256SUMS.txt.
          token: ${{ github.token }}
